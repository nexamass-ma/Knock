name: Build Android APK

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.1
          cache: true

      - name: Install packages
        run: flutter pub get

      - name: Fetch licensed support photo (Unsplash licence, credited in-app)
        run: curl -fsSL "https://images.unsplash.com/photo-1603714228681-b399854b8f80?ixlib=rb-4.1.0&q=85&fm=jpg&crop=entropy&cs=srgb&w=1200" -o assets/support/support_agent.jpg || true

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Build release-mode APK (debug-signed, faster for demos)
        id: release
        continue-on-error: true
        run: flutter build apk --release 2>&1 | tee release-build.log; exit ${PIPESTATUS[0]}

      - name: Show release build errors
        if: steps.release.outcome == 'failure'
        run: |
          grep -E "e: |error:|ERROR|What went wrong|Missing class|Exception|> " release-build.log | head -40 | while IFS= read -r line; do echo "::error::${line}"; done || true
          echo "::warning::Release-mode APK failed; publishing the debug APK only."

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-debug.apk dist/knock-prototype-debug.apk
          if [ -f build/app/outputs/flutter-apk/app-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-release.apk dist/knock-prototype.apk
          fi
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: knock-apk
          path: dist/*.apk
          retention-days: 30

      # Publishes the latest build of this branch as a pre-release so the APK
      # can be downloaded straight to a phone. Skipped for forks/PR events.
      - name: Publish pre-release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="prototype-${GITHUB_REF_NAME//\//-}"
          gh release delete "$TAG" --cleanup-tag --yes || true
          gh release create "$TAG" dist/*.apk \
            --target "$GITHUB_SHA" --prerelease \
            --title "KNOCK prototype (${GITHUB_REF_NAME}, ${GITHUB_SHA::7})" \
            --notes "Prototype build with mock services. Not connected to real money. knock-prototype.apk is the smoother build for demos; knock-prototype-debug.apk is the debug build."

  ios-compile-check:
    # Manual only: macOS minutes are expensive. Compiles iOS without signing.
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.1
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
