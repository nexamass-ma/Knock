name: Build Android APK

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.1
          cache: true

      - name: Install packages
        run: flutter pub get

      - name: Fetch licensed support photo (Unsplash licence, credited in-app)
        run: curl -fsSL "https://images.unsplash.com/photo-1603714228681-b399854b8f80?ixlib=rb-4.1.0&q=85&fm=jpg&crop=entropy&cs=srgb&w=1200" -o assets/support/support_agent.jpg || true

      - name: Fetch licensed intro photos (Unsplash licence, credited in-app)
        run: |
          set -e
          fetch() { curl -fsSL --retry 4 --retry-delay 3 "https://images.unsplash.com/$2?ixlib=rb-4.1.0&q=78&fm=jpg&crop=entropy&cs=srgb&w=1080" -o "assets/onboarding/$1.jpg"; }
          fetch intro_1 photo-1688386007312-94920c722ef5
          fetch intro_2 photo-1784413164937-d08880082caa
          fetch intro_3 photo-1768244016470-271b210a8407
          ls -la assets/onboarding

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug --build-number=${{ github.run_number }}

      - name: Build release-mode APK (debug-signed, faster for demos)
        id: release
        continue-on-error: true
        run: flutter build apk --release --build-number=${{ github.run_number }} 2>&1 | tee release-build.log; exit ${PIPESTATUS[0]}

      - name: Build smaller per-phone APKs (arm64 for most phones, armv7 for older ones)
        if: steps.release.outcome == 'success'
        continue-on-error: true
        run: |
          mkdir -p dist && cp build/app/outputs/flutter-apk/app-release.apk dist/knock-prototype.apk
          flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64 --build-number=${{ github.run_number }}

      - name: Show release build errors
        if: steps.release.outcome == 'failure'
        run: |
          grep -E "e: |error:|ERROR|What went wrong|Missing class|Exception|> " release-build.log | head -40 | while IFS= read -r line; do echo "::error::${line}"; done || true
          echo "::warning::Release-mode APK failed; publishing the debug APK only."

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-debug.apk dist/knock-prototype-debug.apk
          if [ ! -f dist/knock-prototype.apk ] && [ -f build/app/outputs/flutter-apk/app-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-release.apk dist/knock-prototype.apk
          fi
          [ ! -f build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ] || cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/knock-prototype-arm64.apk
          [ ! -f build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk ] || cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/knock-prototype-armv7.apk
          (cd dist && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt)
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: knock-apk
          path: dist/*.apk
          retention-days: 30

      # Publishes the latest build of this branch as a pre-release so the APK
      # can be downloaded straight to a phone. Skipped for forks/PR events.
      - name: Publish pre-release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="prototype-${GITHUB_REF_NAME//\//-}"
          TITLE="KNOCK prototype (${GITHUB_REF_NAME}, ${GITHUB_SHA::7})"
          NOTES="Prototype build with sandbox services. Not connected to real money. Most phones: knock-prototype-arm64.apk (smaller). Any phone: knock-prototype.apk. Builds share one signing key, so a new build installs over the previous one."
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Replace files in place so the download link never disappears.
            git tag -f "$TAG" "$GITHUB_SHA"
            git push -f origin "refs/tags/$TAG"
            gh release upload "$TAG" dist/*.apk dist/SHA256SUMS.txt --clobber
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES" --prerelease
          else
            gh release create "$TAG" dist/*.apk dist/SHA256SUMS.txt --target "$GITHUB_SHA" --prerelease --title "$TITLE" --notes "$NOTES"
          fi

  ios-compile-check:
    # Manual only: macOS minutes are expensive. Compiles iOS without signing.
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.1
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
